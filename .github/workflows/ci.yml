# Runs on every pull request and every push to main.
# Judges opening the repo see a green check next to each commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contract tests (Rust / Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + the Soroban wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run all contract tests
        run: cargo test --workspace

      - name: Check the contracts compile to wasm
        run: cargo build --workspace --target wasm32v1-none --release

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Typecheck every workspace
        run: npm run typecheck
